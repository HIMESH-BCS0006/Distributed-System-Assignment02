version: "3.9"

services:
  grpc-server:
    build:
      context: ./grpc-server
    container_name: library-grpc-server
    ports:
      - "9090:9090"
    networks:
      - library-net

  gateway:
    build:
      context: ./gateway
    container_name: library-gateway
    depends_on:
      - grpc-server
    environment:
      GRPC_SERVER_HOST: grpc-server
      GRPC_SERVER_PORT: "9090"
    ports:
      - "8080:8080"
    networks:
      - library-net

networks:
  library-net:
    driver: bridge

# The SOAP client is intentionally NOT part of this compose file — it
# represents an external legacy system that happens to call the gateway;
# run it separately (see README) once the gateway is up, or use
# sample-requests/run_samples.sh to test with plain curl instead.
